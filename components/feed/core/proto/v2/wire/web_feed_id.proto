syntax = "proto2";

package feedwire;

option optimize_for = LITE_RUNTIME;

message DomainWebFeedId {
  oneof id_oneof {
    string web_web_feed_id = 2;
    string mid = 3;
    string web_feed_name = 4;
  }
}
message WebFeedId {
  oneof id_oneof {
    DomainWebFeedId domain_web_feed_id = 7;
  }
}

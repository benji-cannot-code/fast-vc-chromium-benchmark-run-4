<!DOCTYPE html>
<html>
  <script>
    function clearCookie() {
      document.cookie = '';
    }

    function setCookie(domain) {
      if (domain)
        document.cookie = 'Foo=Bar; Domain=' + domain;
      else
        document.cookie = 'Foo=Bar';
    }

    function getCookie() {
      if (document.cookie)
        return document.cookie;

      return '';
    }
  </script>
  <body>Test for setting and getting cookies.</body>
</html>

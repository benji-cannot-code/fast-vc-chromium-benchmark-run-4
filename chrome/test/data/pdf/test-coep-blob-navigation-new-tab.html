<!DOCTYPE html>
<title>Blob navigation with COEP headers in a new tab</title>
<script>
const openBlobPdfInNewTab = () => {
  fetch('/pdf/test.pdf').then(response => response.blob()).then(blob => {
    const url = URL.createObjectURL(blob);
    window.open(url);
    URL.revokeObjectURL(url);
  });
};
</script>

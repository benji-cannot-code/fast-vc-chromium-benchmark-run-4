<!doctype html>
<html>
<head>
<script>
if (window.testRunner)
    testRunner.waitUntilDone();

function runTest() {
    var shadow = host.webkitCreateShadowRoot();
    shadow.applyAuthorStyles = false;
    shadow.innerHTML = "<div id='hostInShadow'><div class='parent'><p ishidden='false'>NotHidden</p><p ishidden='true' id='target'>Hidden</p></div></div>";

    var innerShadow = shadow.getElementById('hostInShadow').webkitCreateShadowRoot();
    innerShadow.applyAuthorStyles = false;
    innerShadow.innerHTML = "<style>content::-webkit-distributed(.parent [ishidden=true]) { display: none; }</style><content>";

    window.setTimeout(function() {
        if (window.testRunner)
            testRunner.notifyDone();
    }, 0);
}
</script>
</head>
<body onload="runTest()">
<div id="host">
</div>
</body>
</html>

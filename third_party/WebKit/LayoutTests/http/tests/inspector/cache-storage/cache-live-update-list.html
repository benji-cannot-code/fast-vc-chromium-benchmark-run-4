        .then(ApplicationTestRunner.dumpCacheTree)

        .then(ApplicationTestRunner.dumpCacheTree)
        .then(ApplicationTestRunner.clearAllCaches)
        .then(TestRunner.completeTest)
        .catch(errorAndExit);
  }

  ApplicationTestRunner.waitForCacheRefresh(main);
}
</script>

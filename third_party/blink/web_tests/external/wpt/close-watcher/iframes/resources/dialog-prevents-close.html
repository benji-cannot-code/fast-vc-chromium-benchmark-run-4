<body>
  <dialog id="d"></dialog>
  <script>
    d.showModal();
    d.addEventListener("cancel", (e) => e.preventDefault());
    window.addEventListener("message", async (e) => {
      if (event.data == "dialog_open") {
        window.parent.postMessage({ open: d.open }, "*");
      } else {
        window.parent.postMessage({ error: `invalid command: ${e.data}` }, "*");
      }
    });
  </script>
</body>

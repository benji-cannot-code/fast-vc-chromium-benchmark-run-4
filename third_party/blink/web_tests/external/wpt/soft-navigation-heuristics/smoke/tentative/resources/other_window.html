<script>
  function navigate() {
    history.pushState({}, "", "/different-url");
  }

  async function getNextSoftNavEntry() {
    return new Promise(resolve => {
      new PerformanceObserver((list, observer) => {
        observer.disconnect();
        resolve(list.getEntries()[0]);
      }).observe({ type: "soft-navigation" });
    });
  }
</script>

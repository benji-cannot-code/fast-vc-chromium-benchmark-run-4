<!DOCTYPE html>
<title>text-box-trim also trims the ":before" and ":after" pseudo elements</title>
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-trim">
<link rel="help" href="https://drafts.csswg.org/css-inline-3/#text-box-edge">
<link rel="match" href="text-box-trim-pseudo-before-after-002-ref.html">
<link rel="stylesheet" type="text/css" href="/fonts/ahem.css" />
<style>
.spacer {
  background: lightgray;
  block-size: 50px;
}
.target {
  font: 50px/2 Ahem;
  text-box-trim: trim-end;
  text-box-edge: text;
}
.target::before {
  content: "X";
  color: blue;
}
.target::after {
  content: "X";
  color: red;
}
</style>
<div class="spacer"></div>
<div class="target">
Aaa
<div class="spacer"></div>

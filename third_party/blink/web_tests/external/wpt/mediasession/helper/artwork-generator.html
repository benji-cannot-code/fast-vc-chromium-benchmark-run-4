<!DOCTYPE html>
<title>MediaImage</title>
<script>
function createArtworkFromURLs(sources) {
  let artwork = [];
  for (const source of sources) {
    artwork.push({
      src: source
    });
  }

  let metadata = new MediaMetadata({
    artwork: artwork
  });
  return metadata.artwork;
}

</script>

<title>ReadableStream size algorithm throws during enqueue</title>

    {
      pull(controller) {
        pullCount++;
        if (pullCount <= 2) {
          controller.enqueue({});
        } else {
          throwOnSize = true;
          try {
            controller.enqueue({});

          }
        }

    },
    {
      size() {

    }
  );
  new Response(rs).text().catch(() => {
    document.documentElement.classList.remove("test-wait");

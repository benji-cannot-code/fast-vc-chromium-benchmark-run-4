<script src="./dispatcher.js"></script>
<script>

  const params = new URLSearchParams(window.location.search);
  const uuid = params.get('uuid');

  let executeOrders = async function() {
    while(true) {
      let task = await receive(uuid);
      eval(`(async () => {${task}})()`);
    }
  };
  executeOrders();

</script>

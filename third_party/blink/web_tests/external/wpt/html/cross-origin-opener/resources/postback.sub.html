<!doctype html>
<meta charset=utf-8>

<script>

let channelName = new URL(location).searchParams.get("channel");
let bc = new BroadcastChannel(channelName);
window.addEventListener("message", (event) => {
  bc.postMessage(event.data);
  window.parent.close();
}, false);

</script>

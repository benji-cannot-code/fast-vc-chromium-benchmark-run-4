<script src="../../assert_selection.js"></script>
<script>
selection_test(
  '<div contenteditable dir="ltr">|abc</div>',
  selection => selection.modify('move', 'left', 'character'),
  '<div contenteditable dir="ltr">|abc</div>',
  '1-0 ltr left character');

selection_test(
  '<div contenteditable dir="ltr">a|bc</div>',
  selection => selection.modify('move', 'left', 'character'),
  '<div contenteditable dir="ltr">|abc</div>',
  '1-1 ltr left character');

selection_test(
  '<div contenteditable dir="ltr">ab|c</div>',
  selection => selection.modify('move', 'left', 'character'),
  '<div contenteditable dir="ltr">a|bc</div>',
  '1-2 ltr left character');

selection_test(
  '<div contenteditable dir="ltr">abc|</div>',
  selection => selection.modify('move', 'left', 'character'),
  '<div contenteditable dir="ltr">ab|c</div>',
  '1-3 ltr left character');
</script>

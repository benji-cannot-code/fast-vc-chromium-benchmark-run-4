<!DOCTYPE html>
<html>
<head>
<style>
.composited {
    will-change: transform;
}
input {
    position:relative;
    width:15px;
    height:15px;
}
span {
    display:inline-block;
    width:20px;
}
</style>
</head>
<body>
<div class="composited">
    <!-- The form elements should be fully rendered, even though they render beyond their bounds -->
    <input type="radio" id="r" />
    <span></span>
    <input type="checkbox" checked />
</div>
</body>
</html>

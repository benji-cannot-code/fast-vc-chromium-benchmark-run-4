  <script type="module">
  import './mock-digital-goods-service.js';

  window.onmessage = async message => {
    if (message.data !== 'Ready') {
      return;
    }

    try {
      await window.getDigitalGoodsService('https://example.com/billing');
      parent.postMessage('Success', '*');

<!-- Not including a body element to ensure the keypress heuristic works on
     malformed HTML -->
  <main id=main>
    <div>
      First LCP!
    </div>
  </main>
  <script>
    testSoftNavigation({
      addContent: () => {
        addTextToDivOnMain();
      },
      link: document.body,
      interactionFunc: () => { window.eventSender.keyDownAsync('j'); },
      eventType: "keypress",
      test: "Keypress on body triggers SoftNavigationHeuristics"});
  </script>

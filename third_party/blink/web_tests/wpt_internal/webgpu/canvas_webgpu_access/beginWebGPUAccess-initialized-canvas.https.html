<!DOCTYPE html>

<h1>Canvas WebGPU Access: beginWebGPUAccess-initialized-canvas</h1>

<p>beginWebGPUAccess() creates a texture from an initialized canvas.</p>

<canvas id="c" width="50" height="50"></canvas>

<script>

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      test_beginWebGPUAccess_initialized_canvas(
          device,
          document.getElementById('c'));
    });
  }, 'beginWebGPUAccess() should create a texture from an initialized canvas.'
);

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      test_beginWebGPUAccess_initialized_canvas(
          device,
          new OffscreenCanvas(50, 50));
    });
  },
  'beginWebGPUAccess() should create a texture from an initialized ' +
  'offscreen canvas.'
);

</script>

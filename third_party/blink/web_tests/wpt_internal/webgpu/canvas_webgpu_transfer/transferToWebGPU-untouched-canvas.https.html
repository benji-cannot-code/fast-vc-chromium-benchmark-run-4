<!DOCTYPE html>

<h1>Canvas2D WebGPU Transfer: transferToWebGPU-untouched-canvas</h1>

<p>transferToWebGPU() creates a texture from an uninitialized canvas.</p>

<canvas id="c" width="50" height="50"></canvas>

<script>

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      test_transferToWebGPU_untouched_canvas(
          device,
          document.getElementById('c'));
    });
  }, 'transferToWebGPU() should create a texture from an uninitialized canvas.'
);

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      test_transferToWebGPU_untouched_canvas(
          device,
          new OffscreenCanvas(50, 50));
    });
  },
  'transferToWebGPU() should create a texture from an uninitialized ' +
  'offscreen canvas.'
);

</script>

<h1>Canvas2D WebGPU Transfer: transferFromWebGPU-context-lost</h1>

<p>transferFromWebGPU() should be a no-op if the canvas context is lost.</p>

<canvas id="c" width="50" height="50"></canvas>

<script>

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      return test_transferFromWebGPU_context_lost(
                 device,
                 document.getElementById('c'),
                 {});
    });
  },
  'transferFromWebGPU() should be a no-op if the 2D context is lost.'
);

promise_test(() => {
    return with_webgpu((adapter, adapterInfo, device) => {
      return test_transferFromWebGPU_context_lost(
                 device,
                 new OffscreenCanvas(50, 50),
                 {});
    });
  },
  'transferFromWebGPU() should be a no-op if the offscreen context is lost.'
);

</script>
